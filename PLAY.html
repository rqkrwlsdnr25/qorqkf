<section class="center"><div class="scene"><div class="moon"></div><div class="meteor"></div><div class="label">CHAPTER 01 · 유성이 내린 산속</div><h1>산속의 열세 갈래</h1><p>처음 마주친 두 사람. 아직 정해지지 않은 선택.</p><span class="scene-num" id="scene-state"></span></div><div id="page"></div><section id="story"><div class="story-heading"><span>이야기의 흐름</span><span id="progress"></span></div><div id="log" aria-live="polite"></div><div id="battle"></div><div id="ending"></div></section><div class="turn-footer"><span id="turn-help"></span><button id="next-turn">다음 턴 →</button></div></section>

function random(s){s.rng=(Math.imul(s.rng,1664525)+1013904223)>>>0;return s.rng/4294967296}
function createState(data,player='jihyo',seed=Date.now()){const s={version:2,day:1,todayActions:0,visited:["path"],rumors:[],phase:"idle",pending:null,history:[],sleepState:null,player,seed:Number(seed)||1,rng:(Number(seed)||1)>>>0,tick:0,location:'path',characters:{},relations:{},events:[],log:[],discovered:[],flags:{},world:{seal:80,fear:25,snakePower:40},inventory:{herb:3,coins:20,book:0},combat:null,ended:false,serial:0};for(const c of data.characters)s.characters[c.id]={...c,maxHp:c.hp,energy:60,maxEnergy:60,stability:75,humanity:20,status:'건강',memories:[],knowledge:[]};for(const a of data.characters)for(const b of data.characters)if(a.id!==b.id)s.relations[a.id+':'+b.id]={affection:10,trust:10,caution:35,fear:0,respect:10,attachment:0,hostility:a.id==='snake'?75:0,romance:0};s.world.snakePower+=Math.floor(random(s)*15);record(s,'하얀 유성이 숲에 떨어졌다. 연기가 걷히고, 백호와 지효의 시선이 처음으로 마주쳤다.','story',8);return s}
function present(s){return Object.values(s.characters).filter(c=>c.id!==s.player&&c.location===s.location&&c.hp>0&&c.status!=='사망')}
function record(s,text,type='story',importance=3,witnesses=null){const e={id:++s.serial,tick:s.tick,turn:s.pending?.turn??s.tick,day:s.day,text,type,importance};s.log.push(e);if(type!=='system'){for(const c of Object.values(s.characters))if(c.hp>0&&(witnesses?witnesses.includes(c.id):c.location===s.location)){c.memories.push({eventId:e.id,text,tick:s.tick,importance,source:'목격',reliability:1});if(c.memories.length>45)c.memories=c.memories.filter((m,i)=>m.importance>=7||i>=c.memories.length-25)}}return e}
function check(s,stat,difficulty=55){const p=s.characters[s.player],chance=Math.round(clamp(70+(p[stat]||10)*2-difficulty+(p.status==='중상'?-20:0),5,95)),roll=1+Math.floor(random(s)*100);const margin=chance-roll;return{chance,roll,result:roll<=5?'대성공':roll>=96?'대실패':margin>=0?'성공':margin>=-15?'부분 성공':'실패',success:roll<=5||(roll<96&&margin>=-15)}}
function relation(s,a,b,changes){const r=s.relations[a+':'+b];if(r)for(const[k,v]of Object.entries(changes))if(k in r)r[k]=clamp(r[k]+v)}

record(s,text,'combat',5);if(r)record(s,`판정 ${r.roll} / 성공 기준 ${r.chance} (${r.result})`,'check');if(c.hp<=0){s.inventory.coins+=12;finish(s,'상대가 쓰러져 전투가 끝났다. 전리품 12전을 얻었다. 상대는 기절 상태다.');return true}if(c.stunned){record(s,'적이 자세를 되찾느라 공격하지 못했다.','combat');c.stunned=false}else if(c.distance===2){c.distance=1;record(s,'상대가 거리를 좁힌다.','combat')}else{const dmg=c.cover?0:Math.max(1,Math.round((c.power+random(s)*7)*(c.guard?.35:1)));p.hp=Math.max(0,p.hp-dmg);record(s,`${c.name}의 반격. ${dmg} 피해.`,'combat');}c.guard=false;c.cover=false;c.round++;if(p.hp<=0){p.status='중상';p.hp=1;const lost=Math.min(15,s.inventory.coins);s.inventory.coins-=lost;s.location=s.version===3?'forest':'home';p.location=s.location;if(!s.visited.includes(s.location))s.visited.push(s.location);finish(s,`의식을 잃었다. 한참 뒤 산속 거처에서 눈을 뜬다. 중상 / ${lost}전 분실. 이번 프로토타입의 패배 결과는 구조와 중상이다.`)}return true}

function chooseRoute(s){const f=s.story.flags;if(f.includes('false_report')&&s.story.pressure<55)return{route:'quiet',reasons:['거짓 보고로 추적 방향을 바꿨다.','남긴 위협이 크지 않았다.']};if(f.includes('parley')&&s.story.pressure<=30)return{route:'quiet',reasons:['협상 의사가 전해졌다.','추가 도발이 공격을 촉발하지 않았다.']};if(s.story.pressure>=60)return{route:'snake',reasons:['도발과 드러난 힘이 뱀의 직접 개입을 불렀다.']};return{route:'minions',reasons:['직접 개입할 만큼 위협적이지 않지만 추적은 멈추지 않았다.']}}
function applyEffects(s,e={}){const p=s.characters[s.player];for(const[k,v]of Object.entries(e.stats||{})){const max=k==='hp'?p.maxHp:k==='energy'?p.maxEnergy:100;p[k]=clamp((p[k]||0)+v,k==='hp'?1:0,max)}for(const[k,v]of Object.entries(e.items||{}))s.inventory[k]=Math.max(0,(s.inventory[k]||0)+v);s.story.pressure=clamp(s.story.pressure+(e.pressure||0));for(const f of e.flags||[])if(!s.story.flags.includes(f))s.story.flags.push(f);const r=s.relations[companionId(s)+':'+s.player];r.trust=clamp(r.trust+(e.trust||0));r.affection=clamp(r.affection+Math.max(0,Math.floor((e.trust||0)/2)))}

function statsForDiff(s){const p=s.characters[s.player];return{체력:p.hp,기력:p.energy,힘:p.power,민첩:p.agility,통찰:p.insight,의지:p.will,정신안정:p.stability,약초:s.inventory.herb,소지금:s.inventory.coins,신뢰:trustValue(s)}}
const battleActions=['attack','skill','guard','dodge','approach','retreat','environment','negotiate','flee','item'];
function storyAction(s,input,plots,expectedId){if(!s.pending||s.pending.id!==expectedId||s.story.ending)return{ok:false,state:s,error:'이미 처리되었거나 종료된 선택입니다.'};const n=copy(s),logStart=n.log.length,dayBefore=n.day;let before=statsForDiff(n);let label,title,text='',roll=null,consume=true;
 if(input.type==='openSub'){if(n.pending.kind!=='menu'||!plots.subs.some(p=>p.id===input.id)||n.story.completed.includes(input.id)||eligibleMain(n,plots))return{ok:false,state:s,error:'지금 열 수 없는 사건입니다.'};const p=plots.subs.find(p=>p.id===input.id);n.story.active={plot:p.id,node:p.entry};n.pending=null;n.story.revision++;setupDecision(n,plots);return{ok:true,state:n,committed:false}}

 if(n.combat){if(input.type!=='battle'||!battleActions.includes(input.id))return{ok:false,state:s,error:'전투 행동을 선택하세요.'};const old=n.combat,ok=combatAction(n,input.id);if(!ok)return{ok:false,state:s,error:n.log.slice(logStart).find(e=>e.type==='system')?.text||'실행할 수 없는 전투 행동입니다.'};n.story.revision++;if(n.combat){n.pending=null;setupDecision(n,plots);return{ok:true,state:n,committed:false}}const resolution=n.story.battleContinuation;before=resolution.baseline;label=resolution.label;title=resolution.title;text=n.lastBattleOutcome==='defeat'?'전투에서 밀려나 거처 쪽으로 후퇴했다. 준비가 부족했다는 기억이 남는다.':n.lastBattleOutcome==='fled'?'싸움을 끝까지 이어가지 않고 퇴로를 확보했다.':n.lastBattleOutcome==='truce'?'전투 중 제안한 휴전이 받아들여졌다.':'상대를 물러서게 했다. 이 산의 대치는 아직 끝나지 않았다.';if(n.lastBattleOutcome==='defeat')applyEffects(n,{pressure:10,flags:['battle_defeat'],trust:-2});else applyEffects(n,{flags:['battle_'+n.lastBattleOutcome]});finishNode(n,resolution.choice,plots);n.story.battleContinuation=null;
 }else if(input.type==='rest'||input.type==='sleep'){if(n.pending.kind!=='menu')return{ok:false,state:s,error:'현재 사건을 해결하거나 서브 플롯 목록으로 돌아가세요.'};const p=n.characters[n.player];label=input.type==='rest'?'잠시 휴식한다':'밤을 보낸다';title='거처의 불빛';if(input.type==='sleep'){n.day++;n.todayActions=0;n.story.sleepCount++;p.hp=clamp(p.hp+35,0,p.maxHp);p.energy=p.maxEnergy;p.stability=clamp(p.stability+12);text=`밤을 보냈습니다 — ${n.day}일차 시작. 거처에서 기력을 되찾았다.`}else{p.hp=clamp(p.hp+8,0,p.maxHp);p.energy=clamp(p.energy+10,0,p.maxEnergy);text='잠시 숨을 고른다. 날짜는 그대로다.'}if(p.hp>p.maxHp*.6)p.status='건강';

function restoreStory(raw,world,plots){if(!raw||![1,2,3].includes(raw.version)||!['jihyo','baekho'].includes(raw.player)||!Number.isInteger(raw.tick)||raw.tick<0)throw Error('지원하지 않는 저장 파일입니다.');if(raw.version<3){const n=newStory(world,raw.player,raw.seed);n.day=Number.isInteger(raw.day)?Math.max(1,raw.day):Math.floor(raw.tick/4)+1;n.tick=raw.tick;const old=raw.characters?.[raw.player];if(old)for(const k of ['hp','energy','power','agility','insight','will','stability','humanity','value'])if(Number.isFinite(old[k]))n.characters[n.player][k]=clamp(old[k],k==='hp'?1:0,k==='hp'?n.characters[n.player].maxHp:k==='energy'?60:100);n.legacyArchive=copy(raw);n.story.migratedFrom=raw.version;record(n,'이전 저장의 날짜·완료 턴·주인공 능력치를 이어받았다. 새 산속 플롯의 선택 이력은 처음부터 시작한다.','system',7,[]);return n}const n=copy(raw),ids=plots.subs.map(p=>p.id),mids=plots.mains.map(p=>p.id);if(n.location!=='forest'||!Number.isInteger(n.day)||n.day<1||!n.story||!Array.isArray(n.story.completed)||!Array.isArray(n.story.mainDone)||!Array.isArray(n.story.records)||!Array.isArray(n.story.flags)||!Array.isArray(n.log)||!Number.isFinite(n.rng)||!Number.isInteger(n.story.revision))throw Error('저장 구조가 손상되었습니다.');if(n.story.completed.some(x=>!ids.includes(x))||n.story.mainDone.some(x=>!mids.includes(x))||new Set(n.story.completed).size!==n.story.completed.length||n.story.ending&&!plots.endings[n.story.ending])throw Error('플롯 정보가 손상되었습니다.');for(const id of ['jihyo','baekho'])if(!n.characters?.[id]||!Number.isFinite(n.characters[id].hp)||!Number.isFinite(n.characters[id].energy))throw Error('캐릭터 정보가 손상되었습니다.');if(!Number.isFinite(n.story.pressure)||!Number.isInteger(n.todayActions)||!n.inventory||!Number.isFinite(n.inventory.herb)||!n.relations?.[companionId(n)+':'+n.player]||!Number.isFinite(trustValue(n))||!Array.isArray(n.visited)||n.visited.some(x=>x!=='forest')||!n.visited.includes('forest'))throw Error('상태 정보가 손상되었습니다.');if(n.story.active&&!currentNode(n,plots))throw Error('현재 장면이 존재하지 않습니다.');if(n.combat&&(!n.story function startNew(){openModal('<div class="eyebrow">NEW CHAPTER</div><h2>누구의 선택을 기록할까요?</h2><p>같은 산에서 시작하지만, 준비와 대응에 따라 다른 큰 사건과 결말로 이어집니다.</p><label for="seed">세계 시드</label><input id="seed" type="number" value="'+Math.floor(Math.random()*999999)+'"><div class="select-characters"><button id="new-jihyo">지효<small>통찰 · 흔들리는 힘</small></button><button id="new-baekho">백호<small>힘 · 수호자의 의무</small></button></div><p>새 역사는 현재 v0.3 자동 저장을 교체합니다.<br>v0.2 저장은 덮어쓰지 않습니다. 필요하면 먼저 기록을 내보내 주세요.</p>');for(const id of['jihyo','baekho'])$('new-'+id).onclick=()=>{state=newStory(world,id,Number($('seed').value));saveAuto();view='story';$('modal').close();draw()}}$('new').onclick=startNew;
function exportSave(){const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='white-meteor-v03-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}$('export').onclick=exportSave;$('save').onclick=()=>{try{localStorage.setItem(MANUAL,JSON.stringify(state));message('수동 저장 완료 · 선택 대기와 전투 상태 포함')}catch{message('저장할 수 없습니다. 기록 파일로 내보내 주세요.')}};
$('load').onclick=()=>{openModal('<h2>기록 이어가기</h2><p>불러온 기록이 현재 v0.3 진행을 교체합니다. 이전 버전은 날짜·턴·주인공 능력치를 옮기고, 새 플롯은 처음부터 시작합니다.</p><button class="wide" id="manual-load">v0.3 수동 저장 불러오기</button><button class="wide" id="import-file">저장 JSON 파일 가져오기</button><button class="wide" id="legacy-load">이 브라우저의 v0.2 자동 저장 가져오기</button>');$('manual-load').onclick=()=>loadText(localStorage.getItem(MANUAL));$('legacy-load').onclick=()=>loadText(localStorage.getItem('meteor-auto'));$('import-file').onclick=()=>$('import').click()};function loadText(text){try{if(!text)throw Error('저장된 기록이 없습니다.');const next=restoreStory(JSON.parse(text),world,plots);state=next;saveAuto();view='story';$('modal').close();draw();message('기록을 불러왔습니다.')}catch(e){message(e.message)}}$('import').onchange=async e=>{const f=e.target.files[0];if(f){if(f.size>8000000)message('8MB 이하 파일을 선택하세요.');else loadText(await f.text())}e.target.value=''};
$('settings').onclick=()=>openModal('<h2>산속의 열세 갈래 · v0.3</h2><p>산속 한 지역 / 서브 플롯 10개 / 메인 플롯 3개 / 준비된 선택지 66개 / 결말 8개.</p><p>서브 플롯을 3개·6개·10개 마치면 각각 메인 플롯이 이어집니다. 작은 사건의 선택은 능력치, 신뢰, 단서와 위협에 영향을 주며 후속 선택을 해금합니다.</p><p>이 버전은 무한 AI 채팅이 아닌 분기형 비주얼노벨 구조입니다. API 연결 없이 전부 플레이할 수 있습니다. 대사와 결과는 준비된 콘텐츠에서 나오며 판정만 시드 난수를 사용합니다.</p><p>일반 행동은 날짜를 바꾸지 않습니다. 작은 사건 목록에서 밤을 보내야 날짜가 넘어갑니다. 메인 사건과 전투 도중에는 먼저 상황을 해결해야 합니다.</p><p>전투 패배는 중상과 후퇴로 이어지며 이야기는 계속됩니다. 세부 사건·대사·분기는 게임용 창작 초안으로, 원작 확정 설정을 뜻하지 않습니다.</p>');
draw();if(restoreError)message('기존 자동 저장 읽기 실패. 원본은 유지됩니다: '+restoreError);else if(first)startNew();
</script></body></html>
