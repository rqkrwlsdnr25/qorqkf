<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101719"><title>백발의 유성 · 산속의 열세 갈래</title><link rel="stylesheet" href="css/game.css"></head><body>
<header><a class="brand" href="#"><span class="sigil">✦</span><span>백발의 유성<small>산속의 열세 갈래 · v0.3</small></span></a><nav id="nav"><button class="active" data-page="story">이야기</button><button data-page="plots">플롯 기록</button><button data-page="relations">인연</button><button data-page="map">산속 지도</button></nav><div class="header-actions"><span class="mode">● 분기형 스토리</span><button id="settings" aria-label="도움말">?</button><button id="save">저장</button></div></header>

<section class="center"><div class="scene"><div class="moon"></div><div class="meteor"></div><div class="label">CHAPTER 01 · 유성이 내린 산속</div><h1>산속의 열세 갈래</h1><p>처음 마주친 두 사람. 아직 정해지지 않은 선택.</p><span class="scene-num" id="scene-state"></span></div><div id="page"></div><section id="story"><div class="story-heading"><span>이야기의 흐름</span><span id="progress"></span></div><div id="log" aria-live="polite"></div><div id="battle"></div><div id="ending"></div></section><div class="turn-footer"><span id="turn-help"></span><button id="next-turn">다음 턴 →</button></div></section>
